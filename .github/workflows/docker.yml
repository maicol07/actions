name: Docker
# Builds the Dockerfile's target from the repo root at `ref`, pushes it as <image>:<tag> (+ the
# extra tags), then scans <image>:<tag> with Trivy. The scan only reports: it never fails the run.
# With push: false it only builds (e.g. on PRs): no login, no scan.
on:
  workflow_call:
    inputs:
      registry:
        description: Registry host, e.g. ghcr.io
        type: string
        required: true
      image:
        description: Image name in the registry, without host and tag
        type: string
        required: true
      tag:
        description: Image tag, the one scanned
        type: string
        required: true
      extra_tags:
        description: More tags, one docker/metadata-action tag rule per line (e.g. `type=raw,value=latest`, `type=sha,prefix=`)
        type: string
        default: ''
      ref:
        description: Git ref to build (e.g. the release tag). Default the commit of the event
        type: string
        default: ''
      push:
        description: Push the image (and scan it); false only builds it
        type: boolean
        default: true
      target:
        description: Dockerfile target
        type: string
        default: prod
      build_args:
        description: Build arguments, one KEY=value per line
        type: string
        default: ''
    secrets:
      registry_username:
        required: false
      registry_password:
        required: false

# No permissions here: the caller grants them (e.g. packages: write to push to ghcr.io).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.registry }}/${{ inputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.tag }}
            ${{ inputs.extra_tags }}
      - if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image_scan:
    needs: build
    if: inputs.push
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.registry_username }}
          TRIVY_PASSWORD: ${{ secrets.registry_password }}
        with:
          version: v0.76.2
          image-ref: ${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.tag }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          # Test fixtures ship fake lock files that are never loaded: their "vulnerabilities" are noise.
          skip-dirs: '**/tests/fixtures'
