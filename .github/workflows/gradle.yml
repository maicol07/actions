name: Gradle
# Base of a project's Gradle quality/test jobs: JDK, Gradle (with its cache) and the given command,
# e.g. `run: ./gradlew detekt check`.
on:
  workflow_call:
    inputs:
      java_version:
        description: JDK version (Temurin)
        type: string
        required: true
      run:
        description: Command to run, e.g. ./gradlew check
        type: string
        required: true

permissions:
  contents: read

jobs:
  gradle:
    # Not on the release PR (main plus the changelog and version bump, already checked on main) nor on
    # its merge (merge commit or squash). A custom merge commit message falls back to running the job.
    if: >-
      github.head_ref != 'release/next' && !(github.event_name == 'push' && (
        startsWith(github.event.head_commit.message, 'chore(release):') ||
        (startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, '/release/next'))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ${{ inputs.run }}
