name: JS
# Base of a project's JS quality/test jobs: Node.js (+ pnpm or Bun, from the lock file), the
# dependencies, and the given command. One call per job, e.g. `run: bun run lint`.
on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version. With a bun.lock, Node.js is installed only when set
        type: string
        default: ''
      fetch_depth:
        description: Commits to fetch (0 = the whole history and the tags, e.g. to lint only the files changed since a ref)
        type: number
        default: 1
      run:
        description: Command to run once the dependencies are installed
        type: string
        required: true

permissions:
  contents: read

jobs:
  js:
    # Not on the release PR (main plus the changelog and version bump, already checked on main) nor on
    # its merge (merge commit or squash). A custom merge commit message falls back to running the job.
    if: >-
      github.head_ref != 'release/next' && !(github.event_name == 'push' && (
        startsWith(github.event.head_commit.message, 'chore(release):') ||
        (startsWith(github.event.head_commit.message, 'Merge pull request') && contains(github.event.head_commit.message, '/release/next'))))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
      - uses: maicol07/actions/setup-js@v1
        with:
          node_version: ${{ inputs.node_version }}
      - run: ${{ inputs.run }}
