name: PHP
# Base of a project's PHP quality/test jobs: PHP, Composer install (cached on composer.lock) and
# the given command. One call per job, e.g. `run: vendor/bin/pest --ci`.
on:
  workflow_call:
    inputs:
      php_version:
        description: PHP version
        type: string
        required: true
      extensions:
        description: PHP extensions, comma separated
        type: string
        default: ''
      run:
        description: Command to run once the dependencies are installed
        type: string
        required: true

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ${{ inputs.extensions }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - run: ${{ inputs.run }}
