name: Portainer
# Deploys a tag to one or more Portainer Swarm stacks (e.g. the same app on several hosts): in each
# stack file, every service running <image> gets the new tag, and the stack is redeployed with a
# pull. The stack file in Portainer stays the one that runs. Then an optional smoke test: on
# failure the previous stack file is redeployed and the job fails.
# The API key acts as its Portainer user: give it a user that only reaches these stacks.
on:
  workflow_call:
    inputs:
      stacks:
        description: >-
          JSON array of the target stacks, e.g. from a repo variable:
          [{"stack_id": 12, "endpoint_id": 1, "url": "https://app.example.com"}].
          `url` is optional: without it, no smoke test
        type: string
        required: true
      image:
        description: Image without tag, as written in the stack files (e.g. registry/namespace/app)
        type: string
        required: true
      tag:
        description: Image tag to deploy
        type: string
        required: true
    secrets:
      portainer_url:
        required: true
      portainer_api_key:
        required: true

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      # A failed stack does not stop the deploy of the others.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.stacks) }}
    # Two deploys must not update the same stack at once.
    concurrency: portainer-${{ matrix.target.endpoint_id }}-${{ matrix.target.stack_id }}
    environment:
      name: production
      url: ${{ matrix.target.url }}
    env:
      PORTAINER_URL: ${{ secrets.portainer_url }}
      API_KEY: ${{ secrets.portainer_api_key }}
      STACK: ${{ matrix.target.stack_id }}
      ENDPOINT: ${{ matrix.target.endpoint_id }}
    steps:
      - name: Deploy
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ inputs.tag }}
        run: |
          api() { curl --fail-with-body -sS -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' "$@"; }
          api "$PORTAINER_URL/api/stacks/$STACK/file" | jq -r .StackFileContent > previous.yml
          api "$PORTAINER_URL/api/stacks/$STACK" | jq -c '.Env // []' > env.json
          cp previous.yml stack.yml
          # Any tag or digest of the image, not other images that only share its prefix.
          yq -i '(.services[] | select(.image // "" | test("^" + strenv(IMAGE) + "([:@].*)?$")) | .image) = strenv(IMAGE) + ":" + strenv(TAG)' stack.yml
          if ! grep -qF "$IMAGE:$TAG" stack.yml; then
            echo "::error::No service of stack $STACK runs $IMAGE"
            exit 1
          fi
          jq -n --rawfile file stack.yml --slurpfile env env.json \
            '{StackFileContent: $file, Env: $env[0], Prune: false, RepullImageAndRedeploy: true}' \
            | api -X PUT "$PORTAINER_URL/api/stacks/$STACK?endpointId=$ENDPOINT" --data @- > /dev/null
          echo "::notice::$IMAGE:$TAG deployed to stack $STACK"
      - name: Smoke test
        id: smoke
        if: matrix.target.url
        env:
          URL: ${{ matrix.target.url }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 10 --retry-delay 10 --retry-all-errors "$URL")
          if [ "$code" -lt 200 ] || [ "$code" -ge 500 ]; then
            echo "::error::Smoke test: $URL -> HTTP $code"
            exit 1
          fi
          echo "Smoke test: $URL -> HTTP $code"
      - name: Rollback
        # Only after a failed smoke test: a failed deploy left the stack as it was.
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          api() { curl --fail-with-body -sS -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' "$@"; }
          jq -n --rawfile file previous.yml --slurpfile env env.json \
            '{StackFileContent: $file, Env: $env[0], Prune: false, RepullImageAndRedeploy: true}' \
            | api -X PUT "$PORTAINER_URL/api/stacks/$STACK?endpointId=$ENDPOINT" --data @- > /dev/null
          echo "::warning::Stack $STACK rolled back to its previous stack file"
