name: Security
# Secrets (private repos) and IaC misconfigurations of the checked-out tree. Vulnerable lock files
# are left to Dependabot alerts and security updates (free on every repo); secrets in public repos
# to GitHub Secret Protection and push protection (free there, paid on private repos).
# Trivy fails only on HIGH/CRITICAL issues that have a fix to apply. trivy-action is pinned by SHA:
# its tags were rewritten in a supply-chain attack (March 2026).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Betterleaks (the gitleaks successor) on the tree, not the history. A false positive gets
  # `betterleaks:allow` at the end of its line; whole paths go in a .betterleaks.toml.
  secret_detection:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://ghcr.io/betterleaks/betterleaks:v1.10.1
        with:
          args: dir --no-banner --redact --verbose .

  # Dockerfile, compose files and other IaC (root user, secrets in ENV...).
  config_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: 1
